<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="2160" height="2160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <!-- sticker base -->
  <rect filter="url(#sh)" x="40" y="30" width="520" height="545" rx="120" fill="#fff" stroke="#e5e7eb" stroke-width="4"/>

  <!-- body + foot -->
  <ellipse cx="400" cy="395" rx="95" ry="80" fill="#23232f"/>
  <ellipse cx="465" cy="480" rx="30" ry="24" fill="#23232f"/>
  <ellipse cx="470" cy="482" rx="11" ry="9" fill="#f4a6b4"/>

  <!-- laptop -->
  <g>
    <rect x="105" y="338" width="180" height="135" rx="12" fill="#a9b4c0" stroke="#23232f" stroke-width="5"/>
    <rect x="115" y="348" width="160" height="115" rx="8" fill="#b9c3ce"/>
    <path d="M195 428 C172 408 174 390 187 390 C192 390 195 394 195 397 C195 394 198 390 203 390 C216 390 218 408 195 428Z" fill="#fff">
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- typing "impact" lines -->
  <g stroke="#23232f" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="330" x2="88" y2="318"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="112" y1="322" x2="106" y2="306"><animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/></line>
  </g>

  <!-- head -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,3;0,0" dur="3s" repeatCount="indefinite"/>
    <circle cx="245" cy="122" r="38" fill="#23232f"/>
    <circle cx="415" cy="122" r="38" fill="#23232f"/>
    <ellipse cx="330" cy="215" rx="122" ry="102" fill="#fff" stroke="#23232f" stroke-width="5"/>
    <ellipse cx="282" cy="218" rx="31" ry="40" fill="#23232f" transform="rotate(20 282 218)"/>
    <ellipse cx="378" cy="218" rx="31" ry="40" fill="#23232f" transform="rotate(-20 378 218)"/>
    <!-- eyes (blink) -->
    <ellipse cx="282" cy="218" rx="15" ry="18" fill="#fff">
      <animate attributeName="ry" values="18;18;1;18;18" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="378" cy="218" rx="15" ry="18" fill="#fff">
      <animate attributeName="ry" values="18;18;1;18;18" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/></ellipse>
    <circle cx="284" cy="222" r="8" fill="#111"/><circle cx="376" cy="222" r="8" fill="#111"/>
    <circle cx="287" cy="218" r="3" fill="#fff"/><circle cx="379" cy="218" r="3" fill="#fff"/>
    <!-- blush, nose, sad mouth -->
    <ellipse cx="238" cy="268" rx="17" ry="11" fill="#f9a8b8" opacity=".8"/>
    <ellipse cx="422" cy="268" rx="17" ry="11" fill="#f9a8b8" opacity=".8"/>
    <ellipse cx="330" cy="258" rx="9" ry="6.5" fill="#23232f"/>
    <path d="M318 285 Q330 274 342 285" stroke="#23232f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- sweat drop -->
    <path d="M452 150 Q460 166 452 172 Q444 166 452 150Z" fill="#7dd3fc" stroke="#38bdf8" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0,-6;0,10;0,10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- arm + coffee (lifts up and down) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-6,-22;-6,-22;0,0" keyTimes="0;0.15;0.45;0.75;1" dur="4s" repeatCount="indefinite"/>
    <!-- cup -->
    <line x1="366" y1="392" x2="382" y2="345" stroke="#3aa655" stroke-width="6" stroke-linecap="round"/>
    <path d="M326 398 L394 398 L384 478 Q360 486 336 478Z" fill="#c68642" stroke="#23232f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M338 420 L384 420 L382 445 L341 445Z" fill="#e0a15e" opacity=".6"/>
    <path d="M322 398 Q360 366 398 398Z" fill="#fff" stroke="#23232f" stroke-width="5" stroke-linejoin="round"/>
    <!-- arm and paw -->
    <path d="M440 448 Q420 462 392 450" stroke="#23232f" stroke-width="34" fill="none" stroke-linecap="round"/>
    <circle cx="384" cy="448" r="19" fill="#23232f"/>
  </g>

  <!-- text -->
  <g font-family="'Arial Black','Arial',Helvetica,sans-serif" font-weight="900" fill="#111" text-anchor="middle">
    <g font-size="40">
      <text x="128" y="165">BORN<animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0;0,3;0,0" dur="3s" repeatCount="indefinite"/></text>
      <text x="128" y="212">TO<animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0;0,3;0,0" dur="3s" begin="0.25s" repeatCount="indefinite"/></text>
      <text x="128" y="259">CHILL<animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0;0,3;0,0" dur="3s" begin="0.5s" repeatCount="indefinite"/></text>
    </g>
    <text x="300" y="538" font-size="32">FORCED TO WORK<animateTransform attributeName="transform" type="translate" values="0,0;8,0;0,0;-8,0;0,0" dur="3.5s" repeatCount="indefinite"/></text>
  </g>
</svg>
