<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="2160" height="2160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect filter="url(#sh)" x="40" y="30" width="520" height="545" rx="120" fill="#fff" stroke="#e5e7eb" stroke-width="4"/>

  <g transform="translate(300 310) scale(0.9) translate(-300 -300)">
    <!-- legs -->
    <ellipse cx="225" cy="500" rx="62" ry="42" fill="#23232f"/>
    <ellipse cx="375" cy="500" rx="62" ry="42" fill="#23232f"/>
    <ellipse cx="205" cy="505" rx="13" ry="10" fill="#f4a6b4"/>
    <ellipse cx="395" cy="505" rx="13" ry="10" fill="#f4a6b4"/>
    <!-- belly -->
    <ellipse cx="300" cy="410" rx="100" ry="95" fill="#fff" stroke="#23232f" stroke-width="5"/>

    <!-- bamboo (sways) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 330 420;2 330 420;-2 330 420" dur="3s" repeatCount="indefinite"/>
      <line x1="170" y1="500" x2="490" y2="300" stroke="#4d8f3a" stroke-width="22" stroke-linecap="round"/>
      <line x1="170" y1="500" x2="490" y2="300" stroke="#79c257" stroke-width="12" stroke-linecap="round"/>
      <g stroke="#3b7a2c" stroke-width="5" stroke-linecap="round">
        <line x1="240" y1="470" x2="246" y2="456"/><line x1="320" y1="420" x2="326" y2="406"/><line x1="400" y1="370" x2="406" y2="356"/>
      </g>
      <path d="M470 312 Q500 255 560 262 Q530 305 470 312Z" fill="#5fae45" stroke="#3b7a2c" stroke-width="4" stroke-linejoin="round"/>
      <path d="M455 322 Q440 270 395 255 Q400 305 455 322Z" fill="#79c257" stroke="#3b7a2c" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <!-- left arm (holding bamboo) -->
    <path d="M378 355 Q418 385 395 425" stroke="#23232f" stroke-width="38" fill="none" stroke-linecap="round"/>
    <circle cx="393" cy="428" r="21" fill="#23232f"/>

    <!-- head -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="195" cy="100" r="44" fill="#23232f"/>
      <circle cx="405" cy="100" r="44" fill="#23232f"/>
      <circle cx="195" cy="100" r="20" fill="#3b3b4d"/><circle cx="405" cy="100" r="20" fill="#3b3b4d"/>
      <ellipse cx="300" cy="205" rx="135" ry="115" fill="#fff" stroke="#23232f" stroke-width="5"/>
      <ellipse cx="240" cy="205" rx="32" ry="42" fill="#23232f" transform="rotate(20 240 205)"/>
      <ellipse cx="360" cy="205" rx="32" ry="42" fill="#23232f" transform="rotate(-20 360 205)"/>
      <!-- eyes: closed -> open cutely -> blink (loop 6s) -->
      <g>
        <ellipse cx="240" cy="205" rx="16" fill="#fff"><animate attributeName="ry" values="1;1;20;20;1;20;20" keyTimes="0;0.08;0.2;0.62;0.66;0.7;1" dur="6s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="360" cy="205" rx="16" fill="#fff"><animate attributeName="ry" values="1;1;20;20;1;20;20" keyTimes="0;0.08;0.2;0.62;0.66;0.7;1" dur="6s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="241" cy="207" rx="10" fill="#111"><animate attributeName="ry" values="1;1;13;13;1;13;13" keyTimes="0;0.08;0.2;0.62;0.66;0.7;1" dur="6s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="359" cy="207" rx="10" fill="#111"><animate attributeName="ry" values="1;1;13;13;1;13;13" keyTimes="0;0.08;0.2;0.62;0.66;0.7;1" dur="6s" repeatCount="indefinite"/></ellipse>
        <g fill="#fff"><animate attributeName="opacity" values="0;0;1;1;0;1;1" keyTimes="0;0.12;0.22;0.62;0.66;0.7;1" dur="6s" repeatCount="indefinite"/>
          <circle cx="245" cy="200" r="4.5"/><circle cx="363" cy="200" r="4.5"/>
          <circle cx="236" cy="212" r="2"/><circle cx="355" cy="212" r="2"/></g>
        <!-- happy closed-eye arcs shown only while closed -->
        <g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"><animate attributeName="opacity" values="1;1;0;0;1;0;0" keyTimes="0;0.07;0.12;0.62;0.64;0.68;1" dur="6s" repeatCount="indefinite"/>
          <path d="M225 207 Q240 192 255 207"/><path d="M345 207 Q360 192 375 207"/></g>
      </g>
      <ellipse cx="205" cy="262" rx="20" ry="12" fill="#f9a8b8" opacity=".8"/>
      <ellipse cx="395" cy="262" rx="20" ry="12" fill="#f9a8b8" opacity=".8"/>
      <ellipse cx="300" cy="250" rx="11" ry="8" fill="#23232f"/>
      <path d="M278 268 Q300 300 322 268Z" fill="#c2415a" stroke="#23232f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M288 281 Q300 292 312 281 Q300 276 288 281Z" fill="#f48aa0"/>
    </g>

    <!-- right arm: waving -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-14 232 365;22 232 365;-14 232 365" dur="0.9s" repeatCount="indefinite"/>
      <path d="M232 365 Q170 340 150 270" stroke="#23232f" stroke-width="40" fill="none" stroke-linecap="round"/>
      <circle cx="148" cy="262" r="25" fill="#23232f"/>
      <ellipse cx="148" cy="266" rx="10" ry="8" fill="#f4a6b4"/>
    </g>
  </g>

  <!-- floating hearts -->
  <path d="M520 150 C505 135 507 122 516 122 C520 122 522 125 522 127 C522 125 524 122 528 122 C537 122 539 135 520 150Z" fill="#f472b6">
    <animateTransform attributeName="transform" type="translate" values="0,10;0,-14;0,-14" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></path>
</svg>
